
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Await & Exception Handling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>JavaScript Day 4 Tasks</h1>
    <p class="subtitle">Async/Await & Exception Handling</p>

    <div class="container">

        <!-- Task 1 -->
        <div class="card">
            <h2>1. Student Details</h2>
            <button onclick="getStudent()">Get Student Details</button>
            <p id="studentResult"></p>
        </div>

        <!-- Task 2 -->
        <div class="card">
            <h2>2. Product Availability</h2>
            <button onclick="checkProduct(true)">Available</button>
            <button onclick="checkProduct(false)">Unavailable</button>
            <p id="productResult"></p>
        </div>

        <!-- Task 3 -->
        <div class="card">
            <h2>3. Login Validation</h2>
            <input type="email" id="email" placeholder="Enter Email">
            <input type="password" id="password" placeholder="Enter Password">
            <button onclick="login()">Login</button>
            <p id="loginResult"></p>
        </div>

        <!-- Task 4 -->
        <div class="card">
            <h2>4. Bank Withdrawal</h2>
            <input type="number" id="balance" placeholder="Enter Balance">
            <input type="number" id="amount" placeholder="Enter Amount">
            <button onclick="withdraw()">Withdraw</button>
            <p id="withdrawResult"></p>
        </div>

        <!-- Task 5 -->
        <div class="card">
            <h2>5. Employee Validation</h2>
            <input type="text" id="empName" placeholder="Employee Name">
            <input type="email" id="empEmail" placeholder="Employee Email">
            <input type="number" id="salary" placeholder="Salary">
            <button onclick="validateEmployee()">Validate</button>
            <p id="employeeResult"></p>
        </div>

        <!-- Task 6 -->
        <div class="card">
            <h2>6. Division</h2>
            <input type="number" id="num1" placeholder="First Number">
            <input type="number" id="num2" placeholder="Second Number">
            <button onclick="divide()">Divide</button>
            <p id="divideResult"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
